[project]
name = "python-foundations-study-part2"
version = "0.1.0"
description = "Python foundations study repository - part 2"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "PTH", "SIM", "UP", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
